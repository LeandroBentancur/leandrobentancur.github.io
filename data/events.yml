# TRAVEL, TALKS AND ATTENDANCE — one entry per event, the highest-churn file.
# This single list feeds three things: the homepage news, the CV's "Talks and
# Presentations" (role: oral|poster) and the CV's "Conferences and Schools
# Attended" (every public entry). One event was previously typed twice, once in
# each CV section — that is what this file exists to prevent.
#
# role:       oral | poster | attended | visit | organizer
# date:       YYYY-MM preferred, YYYY when the month is genuinely unknown.
#             Public pages print month + year only, never day ranges.
# visibility: public   — everything in this file, and there is no other kind.
#             The repository is public, so an event that is not announced yet
#             does not belong in it at all. Keep it out until it is announced;
#             marking a committed row "private" hides it from the page, not
#             from anyone reading the repo.
# i18n:       fields are English; add name_es / place_es only when they differ.
# featured:   true, and only then does the event reach the homepage's "Recent &
#             upcoming" list. That list is chosen by hand, not by recency: mark
#             what a visitor should see, unmark it when it stops being news.
#             Unmarked events still reach the talks list and the CV, so removing
#             the line hides an event from the homepage, never from the record.
#             Anything still in the future sits at the top, tagged "soon".

